<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask · School Day</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f1ea">
<link rel="stylesheet" href="../ask.css">
</head>
<body>
<div class="ask" id="ask" data-started="0">

  <header class="head">
    <div class="head-in">
      <div>
        <a class="back" href="../">← School Day</a>
        <div class="titlerow">
          <h1>Ask</h1>
          <p class="tagline">Anything about the girls' school life — what's coming up, what to bring, who's who.</p>
        </div>
      </div>
      <div class="headlinks">
        <a href="#" class="headlink" id="newconv">New conversation</a>
        <a href="#" class="headlink" id="forgetkey">Forget key</a>
      </div>
    </div>
  </header>

  <div class="scroll" id="scroll">
    <div class="col">

      <div class="lead"><h2>What would you like to know?</h2></div>

      <div id="messages"></div>

      <div class="composer">
        <div class="box" id="box" data-focus="0">
          <textarea id="input" rows="1" aria-label="Your question"
                    placeholder="What do the girls need for next week?"></textarea>
          <div class="boxrow">
            <div class="people" id="people" role="group" aria-label="Who this is about"></div>
            <button type="button" class="submit" id="submit" disabled>Ask</button>
          </div>
        </div>
        <div class="suggestions" id="suggestions"></div>
      </div>

    </div>
  </div>

</div>
<script src="../ask.js"></script>
</body>
</html>
