<!doctype html>
<html lang="en">
<head>

<title>School Day</title>
<link rel="manifest" href="manifest.webmanifest">

<body>
<div class="wrap page-day">
  <header>
    <div class="headtext">
      <h1 class="hello" id="hello">School Day</h1>
      <p class="today" id="todayline">Loading…</p>
    </div>
    <a class="asklink" id="asklink" href="/ask/" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M11 3.5c.4 1.3 1.2 2.6 2.4 3.6 1.2 1 2.6 1.6 4.1 1.9-1.5.3-2.9.9-4.1 1.9-1.2 1-2 2.3-2.4 3.6-.4-1.3-1.2-2.6-2.4-3.6C7.4 9.9 6 9.3 4.5 9c1.5-.3 2.9-.9 4.1-1.9 1.2-1 2-2.3 2.4-3.6Z"
              fill="currentColor"/>
        <path d="M18 13.5c.2.7.6 1.3 1.2 1.8.6.5 1.3.8 2.1 1-.8.2-1.5.5-2.1 1-.6.5-1 1.1-1.2 1.8-.2-.7-.6-1.3-1.2-1.8-.6-.5-1.3-.8-2.1-1 .8-.2 1.5-.5 2.1-1 .6-.5 1-1.1 1.2-1.8Z"
              fill="currentColor"/>
      </svg>Ask</a>
  </header>

  <div class="controls">
    <div id="kidfilter"></div>
    <label class="toggle" id="schoolToggle" data-on="1">
      <input type="checkbox" id="showSchool" checked> School events
    </label>
  </div>

  <div id="content">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <footer>
    <button class="fresh" id="fresh" data-state="unknown" data-open="0"
            aria-expanded="false" aria-controls="synclog" title="Tap for the sync log">
      <span class="pip"></span><span class="txt">Checking…</span><span class="more"></span>
    </button>
    <div class="synclog" id="synclog" hidden></div>
  </footer>
</div>
<script src="a2hs.js?v=66d9c314"></script>
<script src="app.js?v=66d9c314"></script>
</body>
</html>
