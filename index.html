<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Day</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5f2">
<link rel="stylesheet" href="app.css?v=5a9e8a55">
</head>
<body>
<div class="wrap page-day">
  <header>
    <h1 class="hello" id="hello">School Day</h1>
    <p class="today" id="todayline">Loading…</p>
  </header>

  <div class="controls">
    <div id="kidfilter"></div>
    <label class="toggle" id="schoolToggle" data-on="1">
      <input type="checkbox" id="showSchool" checked> School events
    </label>
    <a class="asklink" id="asklink" href="/ask/" hidden>
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4.5 2.5h7a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2H7l-2.5 2.5V11a2 2 0 0 1-2-2V4.5a2 2 0 0 1 2-2Z"
              fill="none" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>Ask</a>
  </div>

  <div id="content">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <footer>
    <button class="fresh" id="fresh" data-state="unknown" data-open="0"
            aria-expanded="false" aria-controls="synclog" title="Tap for the sync log">
      <span class="pip"></span><span class="txt">Checking…</span><span class="more"></span>
    </button>
    <div class="synclog" id="synclog" hidden></div>
  </footer>
</div>
<script src="app.js?v=5a9e8a55"></script>
</body>
</html>
